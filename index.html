<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>ДЗ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Четыре вкладки: ДЗ (эта страница), Пульт (pult.html), VPN и Сервер (ctl.html). Вкладку задаёт ?tab=dz|pult|vpn|srv
// (кнопки /menu, карточка урока — startapp=dz); без него — та, что была последней.
(function () {
  try {
    var w = window.Telegram && window.Telegram.WebApp;
    var sp = w && w.initDataUnsafe && w.initDataUnsafe.start_param;
    var q = new URLSearchParams(location.search);
    var tab = sp === "dz" ? "dz" : q.get("tab") || localStorage.getItem("dz_tab") || "dz";
    var page = { pult: "pult.html", vpn: "ctl.html", srv: "ctl.html" }[tab];
    localStorage.setItem("dz_tab", page ? tab : "dz");
    if (page) location.replace(page + "?g=" + encodeURIComponent(q.get("g") || localStorage.getItem("dz_gist") || "") + "&tab=" + tab);
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #0f1a1c);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #17272a));
  --text: var(--tg-theme-text-color, #e9f1f1);
  --hint: var(--tg-theme-hint-color, #7f9698);
  --link: var(--tg-theme-link-color, #6ac7c1);
  --accent: var(--tg-theme-button-color, #3fa9a2);
  --on-accent: var(--tg-theme-button-text-color, #fff);
  --line: rgba(128, 150, 152, .18);
  --ok: #45c08a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.35 -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif;
  padding: 14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

.apps { display: flex; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.apps button { flex: 1; text-align: center; border-radius: 9px; padding: 8px 6px; white-space: nowrap; font-weight: 600; font-size: 14px; color: var(--hint); }
.apps button.on { background: var(--accent); color: var(--on-accent); }
.tabs { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px 14px; padding: 0 14px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--card); color: var(--hint); font-weight: 600; }
.tab.on { background: var(--accent); color: var(--on-accent); }

.hero { background: var(--card); border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.ring { flex: none; width: 64px; height: 64px; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .35s ease, stroke .35s; }
.ring.full .bar { stroke: var(--ok); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.hero h1 { margin: 0 0 3px; font-size: 19px; line-height: 1.2; }
.hero p { margin: 0; color: var(--hint); font-size: 13.5px; }
.hero p b { color: var(--text); font-weight: 600; }
.hero .soon { color: #e8a34a; }

.group { margin-top: 18px; }
.ghead { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 7px; width: 100%; }
.ghead .t { padding: 4px 0; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); flex: 1; }
.ghead .n { font-size: 12.5px; color: var(--hint); font-variant-numeric: tabular-nums; }
.ghead .go { font-size: 12.5px; color: var(--link); font-weight: 600; }
.ghead .chev { display: inline-block; transition: transform .2s; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed .list, .group.closed > .orig { display: none; }
.section { margin-top: 18px; }
.shead { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 2px; width: 100%; }
.shead .t { flex: 1; padding: 4px 0; font-size: 16px; font-weight: 700; }
.shead .chev { display: inline-block; color: var(--hint); transition: transform .2s; }
.shead .n { font-size: 12.5px; color: var(--hint); font-variant-numeric: tabular-nums; }
.shead .go { font-size: 12.5px; color: var(--link); font-weight: 600; }
.section.closed .chev { transform: rotate(-90deg); }
.section.closed .sbody { display: none; }
.section .group.sub { margin-top: 10px; }
.list { background: var(--card); border-radius: 16px; overflow: hidden; }

.item { display: flex; flex-wrap: wrap; align-items: stretch; min-height: 50px; }
.info { flex: none; align-self: center; width: 24px; height: 24px; margin: 0 4px; border-radius: 50%; border: 1.5px solid var(--hint); color: var(--hint);
  font: italic 700 13px/1 Georgia, "Times New Roman", serif; display: flex; align-items: center; justify-content: center; text-align: center; }
.info.on { border-color: var(--link); color: var(--link); }
.ghead .info { width: 20px; height: 20px; font-size: 11.5px; align-self: baseline; }
.orig { flex: 0 0 100%; padding: 2px 14px 12px 50px; }
.group > .orig { padding: 0 6px 10px; }
.orig .o { border-left: 2px solid var(--link); padding: 2px 0 2px 10px; }
.orig .o + .o { margin-top: 9px; }
.orig .src { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); }
.orig .q { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; white-space: pre-line; }
.orig .ru { font-size: 13px; color: var(--hint); margin-top: 3px; overflow-wrap: anywhere; }
.item + .item { border-top: 1px solid var(--line); }
.check { flex: none; width: 50px; display: flex; align-items: center; justify-content: center; }
.check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--hint); display: flex; align-items: center; justify-content: center; transition: background .18s, border-color .18s, transform .18s; }
.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.4); transition: opacity .18s, transform .18s; }
.item.done .check i { background: var(--ok); border-color: var(--ok); }
.item.done .check svg { opacity: 1; transform: none; }
.check:active i { transform: scale(.86); }
.body { flex: 1 1 0; min-width: 0; padding: 10px 12px 10px 0; display: flex; flex-direction: column; justify-content: center; }
.body .tx { overflow-wrap: anywhere; transition: color .18s; }
.tx .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--link); margin-left: 7px; vertical-align: middle; }
.body .sub { color: var(--hint); font-size: 12.5px; margin-top: 1px; }
.item.done .tx { color: var(--hint); text-decoration: line-through; text-decoration-color: var(--line); }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { padding: 4px 10px; border-radius: 999px; background: rgba(106, 199, 193, .13); color: var(--link); font-size: 12.5px; font-weight: 600; }
.chip:active, .arrow:active { opacity: .55; }
.arrow { flex: none; width: 44px; display: flex; align-items: center; justify-content: center; color: var(--link); }
.arrow svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.older { margin-top: 26px; }
.older > .cap { padding: 0 6px 7px; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); }
.lrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow .d { flex: 1; font-weight: 600; }
.lrow .c { color: var(--hint); font-variant-numeric: tabular-nums; }
.lrow .c.ok { color: var(--ok); }
.back { color: var(--link); font-weight: 600; padding: 2px 6px 12px; }
.empty { text-align: center; color: var(--hint); padding: 60px 20px; }
.foot { text-align: center; color: var(--hint); font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<nav class="apps" aria-label="Разделы"><button class="on" aria-current="page">ДЗ</button><button id="goPult">Пульт</button><button class="own" data-ctl="vpn" hidden>VPN</button><button class="own" data-ctl="srv" hidden>Сервер</button></nav>
<div id="app"><div class="empty">Загружаю…</div></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const qs = new URLSearchParams(location.search);
const GIST = qs.get("g") || localStorage.getItem("dz_gist") || "";
if (qs.get("g")) localStorage.setItem("dz_gist", GIST);
const DESKTOP = !!tg && tg.platform === "tdesktop";
const cloud = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;

const store = {
  get(key) {
    return new Promise(res => {
      const local = () => { try { res(JSON.parse(localStorage.getItem(key) || "null")); } catch (e) { res(null); } };
      if (!cloud) return local();
      cloud.getItem(key, (err, val) => { if (err || !val) return local(); try { res(JSON.parse(val)); } catch (e) { res(null); } });
    });
  },
  set(key, val) {
    const s = JSON.stringify(val);
    try { localStorage.setItem(key, s); } catch (e) {}
    if (cloud) cloud.setItem(key, s, () => {});
  },
};

const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const DAYS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
const ARROW = '<svg viewBox="0 0 20 20"><path d="M7 4h9v9M16 4L5 15"/></svg>';

let data = null, subj = null, lessonId = null;
let folds = {};          // "subj/lesson/название блока" -> свёрнут ли (помнится на устройстве)
try { folds = JSON.parse(localStorage.getItem("dz_fold") || "{}"); } catch (e) {}
const foldKey = g => subj + "/" + lessonId + "/" + g.title;
const isClosed = g => foldKey(g) in folds ? folds[foldKey(g)] : !!g.optional;
const doneCache = {};   // "subj/lesson" -> Set(id)

const keyOf = (s, l) => "d_" + s + "_" + l;
async function loadDone(s, l) {
  const k = s + "/" + l;
  if (!doneCache[k]) doneCache[k] = new Set((await store.get(keyOf(s, l))) || []);
  return doneCache[k];
}
const counted = lesson => lesson.groups.flatMap(g => g.items);   // в счёт идёт всё, и пункты «по желанию» (opt) тоже

function pickLink(l) {
  if (DESKTOP && l.pc) return l.pc;
  return l.u || l.tg || l.pc;
}
function openLink(url) {
  if (!url) return;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) return tg.openTelegramLink(url);
  if (tg && tg.openLink && inTg) return tg.openLink(url);
  window.open(url, "_blank");
}

function dueLine(lesson) {
  if (!lesson.due) return "";
  const due = new Date(lesson.due), ms = due - Date.now();
  const when = DAYS[due.getDay()] + " " + due.getDate() + " " + MONTHS[due.getMonth()] + ", "
    + String(due.getHours()).padStart(2, "0") + ":" + String(due.getMinutes()).padStart(2, "0");
  if (ms <= 0) return "Сдавалось к <b>" + when + "</b>";
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  const left = d >= 1 ? d + " д " + (h % 24) + " ч" : h >= 1 ? h + " ч" : Math.max(1, Math.round(ms / 6e4)) + " мин";
  return "Сдать к <b>" + when + "</b> · <span class=\"" + (h < 24 ? "soon" : "") + "\">через " + left + "</span>";
}

function ring(done, total) {
  const r = 26, c = 2 * Math.PI * r, p = total ? done / total : 0;
  return '<div class="ring' + (total && done === total ? " full" : "") + '"><svg viewBox="0 0 64 64">'
    + '<circle class="track" cx="32" cy="32" r="' + r + '"/><circle class="bar" cx="32" cy="32" r="' + r + '" stroke-dasharray="' + c
    + '" stroke-dashoffset="' + c * (1 - p) + '"/></svg><b>' + done + "/" + total + "</b></div>";
}

// Исходная формулировка задания (из Classroom / из записи в чате) и перевод, если она на французском.
const infoBtn = orig => orig && orig.length ? '<button class="info" data-info="1" aria-label="Оригинал задания">i</button>' : "";
const origHtml = orig => !orig || !orig.length ? "" : '<div class="orig" hidden>' + orig.map(o =>
  '<div class="o"><div class="src">' + esc(o.src || "Оригинал") + '</div><div class="q">' + esc(o.text) + "</div>"
  + (o.ru ? '<div class="ru">' + esc(o.ru) + "</div>" : "") + "</div>").join("") + "</div>";

function itemHtml(it, done, lid) {
  const links = (it.links || []).map(l => ({ t: l.t, url: pickLink(l) })).filter(l => l.url);
  const single = links.length === 1 && !links[0].t;
  return '<div class="item' + (done.has(it.id) ? " done" : "") + '" data-id="' + esc(it.id) + '"' + (lid ? ' data-l="' + esc(lid) + '"' : "") + '>'
    + '<button class="check" data-toggle="' + esc(it.id) + '"' + (lid ? ' data-l="' + esc(lid) + '"' : "") + ' aria-label="Отметить"><i>' + CHECK + "</i></button>"
    + '<div class="body"' + (single ? ' data-url="' + esc(links[0].url) + '"' : "") + '><div class="tx">' + esc(it.text) + (it.opt ? '<span class="dot"></span>' : "") + "</div>"
    + (it.sub ? '<div class="sub">' + esc(it.sub) + "</div>" : "")
    + (!single && links.length ? '<div class="links">' + links.map((l, n) => '<button class="chip" data-url="' + esc(l.url) + '">'
        + esc(l.t || "ссылка " + (n + 1)) + "</button>").join("") + "</div>" : "")
    + "</div>" + infoBtn(it.orig) + (single ? '<button class="arrow" data-url="' + esc(links[0].url) + '" aria-label="Открыть">' + ARROW + "</button>" : "")
    + origHtml(it.orig) + "</div>";
}

async function render() {
  const app = document.getElementById("app");
  if (!data || !data.subjects || !data.subjects.length) { app.innerHTML = '<div class="empty">Заданий пока нет</div>'; return; }
  const s = data.subjects.find(x => x.id === subj) || data.subjects[0];
  subj = s.id;
  const lessons = s.lessons.slice().sort((a, b) => b.date.localeCompare(a.date));
  const lesson = lessons.find(l => l.id === lessonId) || lessons[0];
  let html = "";
  if (data.subjects.length > 1) {
    html += '<div class="tabs">' + data.subjects.map(x => '<button class="tab' + (x.id === subj ? " on" : "") + '" data-subj="' + esc(x.id) + '">'
      + esc((x.emoji ? x.emoji + " " : "") + x.title) + "</button>").join("") + "</div>";
  }
  if (!lesson) { app.innerHTML = html + '<div class="empty">Заданий пока нет</div>'; return; }
  lessonId = lesson.id;
  const done = await loadDone(subj, lesson.id);
  const main = counted(lesson), nDone = main.filter(i => done.has(i.id)).length;
  const d = new Date(lesson.date + "T12:00:00");
  if (lesson !== lessons[0]) html += '<button class="back" data-lesson="' + esc(lessons[0].id) + '">← к последнему уроку</button>';
  html += '<div class="hero" id="hero">' + ring(nDone, main.length) + "<div><h1>" + esc((s.emoji ? s.emoji + " " : "") + s.title)
    + " · урок " + d.getDate() + " " + MONTHS[d.getMonth()] + "</h1><p>" + (nDone === main.length && main.length ? "Всё сделано 🎉" : dueLine(lesson)) + "</p></div></div>";
  // Блоки с одинаковым "section" (например, Classroom: Réviser + Préparer) идут одним сворачиваемым разделом;
  // остальные блоки не сворачиваются, кроме необязательных ("optional").
  let openSection = null;
  lesson.groups.forEach((g, gi) => {
    const gDone = g.items.filter(i => done.has(i.id)).length;
    if (openSection && g.section !== openSection) { html += "</div></div>"; openSection = null; }
    if (g.section && !openSection) {
      openSection = g.section;
      const all = lesson.groups.filter(x => x.section === g.section).flatMap(x => x.items);
      const sec = { title: "§" + g.section };
      html += '<div class="section' + (isClosed(sec) ? " closed" : "") + '"><div class="shead">'
        + '<button class="t" data-sfold="' + esc(g.section) + '"><span class="chev">▾</span> ' + esc(g.section) + "</button>"
        + (g.url ? '<button class="go" data-url="' + esc(g.url) + '">открыть ↗</button>' : "")
        + '<span class="n" data-scount="' + esc(g.section) + '">' + all.filter(i => done.has(i.id)).length + "/" + all.length
        + '</span></div><div class="sbody">';
    }
    const foldable = !g.section && g.optional;
    html += '<div class="group' + (foldable && isClosed(g) ? " closed" : "") + (g.section ? " sub" : "") + '" data-g="' + gi + '"><div class="ghead">'
      + (foldable ? '<button class="t" data-fold="' + gi + '"><span class="chev">▾</span> ' + esc(g.title) + "</button>"
                  : '<span class="t">' + esc(g.title) + "</span>")
      + (g.url && !g.section ? '<button class="go" data-url="' + esc(g.url) + '">' + esc(g.tag || "открыть") + " ↗</button>" : "")
      + infoBtn(g.orig) + '<span class="n" data-count="' + gi + '">' + gDone + "/" + g.items.length + "</span></div>"
      + origHtml(g.orig) + '<div class="list">';
    g.items.forEach(it => { html += itemHtml(it, done); });
    html += "</div></div>";
  });
  if (openSection) html += "</div></div>";
  // Архив: невыполненное со старых уроков (сделанное пропадает), сворачивается как раздел Classroom.
  if (lesson === lessons[0]) {
    let arch = "", total = 0;
    for (const l of lessons.slice(1)) {
      const dn = await loadDone(subj, l.id), left = counted(l).filter(i => !dn.has(i.id));
      if (!left.length) continue;
      total += left.length;
      const ld = new Date(l.date + "T12:00:00");
      arch += '<div class="group sub" data-al="' + esc(l.id) + '"><div class="ghead"><span class="t">урок ' + ld.getDate() + " " + MONTHS[ld.getMonth()]
        + '</span></div><div class="list">' + left.map(it => itemHtml(it, dn, l.id)).join("") + "</div></div>";
    }
    if (total) {
      html += '<div class="section older' + (folds[subj + "/archive"] === false ? "" : " closed") + '"><div class="shead">'
        + '<button class="t" data-afold="1"><span class="chev">▾</span> Старые невыполненные</button>'
        + '<span class="n" id="acount">' + total + '</span></div><div class="sbody">' + arch + "</div></div>";
    }
  }
  if (data.updated) html += '<div class="foot">обновлено ' + esc(data.updated) + "</div>";
  app.innerHTML = html;
}

async function toggleOld(id, lid) {
  const done = await loadDone(subj, lid), on = !done.has(id);
  on ? done.add(id) : done.delete(id);
  store.set(keyOf(subj, lid), [...done]);
  const row = document.querySelector('.item[data-l="' + CSS.escape(lid) + '"][data-id="' + CSS.escape(id) + '"]');
  if (row) row.classList.toggle("done", on);
  const c = document.getElementById("acount");
  if (c) c.textContent = document.querySelectorAll(".older .item:not(.done)").length;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(on ? "medium" : "light");
}

async function toggle(id) {
  const done = await loadDone(subj, lessonId);
  const on = !done.has(id);
  on ? done.add(id) : done.delete(id);
  store.set(keyOf(subj, lessonId), [...done]);
  const s = data.subjects.find(x => x.id === subj), lesson = s.lessons.find(l => l.id === lessonId);
  const row = document.querySelector('.item[data-id="' + CSS.escape(id) + '"]');
  if (row) row.classList.toggle("done", on);
  lesson.groups.forEach((g, gi) => {
    const el = document.querySelector('[data-count="' + gi + '"]');
    if (el) el.textContent = g.items.filter(i => done.has(i.id)).length + "/" + g.items.length;
  });
  document.querySelectorAll("[data-scount]").forEach(el => {
    const all = lesson.groups.filter(x => x.section === el.dataset.scount).flatMap(x => x.items);
    el.textContent = all.filter(i => done.has(i.id)).length + "/" + all.length;
  });
  const main = counted(lesson), n = main.filter(i => done.has(i.id)).length, full = main.length && n === main.length;
  const hero = document.getElementById("hero");
  hero.querySelector(".ring").outerHTML = ring(n, main.length);
  hero.querySelector("p").innerHTML = full ? "Всё сделано 🎉" : dueLine(lesson);
  if (tg && tg.HapticFeedback) full && on ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred(on ? "medium" : "light");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle],[data-url],[data-subj],[data-lesson],[data-fold],[data-sfold],[data-afold],[data-info]");
  if (!t) return;
  if (t.dataset.info) {
    const box = (t.closest(".item") || t.closest(".group")).querySelector(":scope > .orig");
    box.hidden = !box.hidden;
    t.classList.toggle("on", !box.hidden);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    return;
  }
  if (t.dataset.toggle) return t.dataset.l ? toggleOld(t.dataset.toggle, t.dataset.l) : toggle(t.dataset.toggle);
  if (t.dataset.afold) {
    folds[subj + "/archive"] = t.closest(".section").classList.toggle("closed");
    try { localStorage.setItem("dz_fold", JSON.stringify(folds)); } catch (e) {}
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    return;
  }
  if (t.dataset.url) return openLink(t.dataset.url);
  if (t.dataset.subj) { subj = t.dataset.subj; lessonId = null; return render(); }
  if (t.dataset.lesson) { lessonId = t.dataset.lesson; render().then(() => window.scrollTo(0, 0)); return; }
  if (t.dataset.sfold) {
    folds[foldKey({ title: "§" + t.dataset.sfold })] = t.closest(".section").classList.toggle("closed");
    try { localStorage.setItem("dz_fold", JSON.stringify(folds)); } catch (e) {}
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    return;
  }
  if (t.dataset.fold) {
    const el = t.closest(".group"), s = data.subjects.find(x => x.id === subj);
    const g = s.lessons.find(l => l.id === lessonId).groups[+t.dataset.fold];
    folds[foldKey(g)] = el.classList.toggle("closed");
    try { localStorage.setItem("dz_fold", JSON.stringify(folds)); } catch (e) {}
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  }
});

// Кнопки «VPN» и «Сервер» — только хозяину бота (owner из gist; данные всё равно отдаются лишь по подписи Telegram)
function showOwn(owner) {
  try {
    if (owner) localStorage.setItem("dz_owner", owner);
    const me = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
    const ok = me && String(me) === String(owner || localStorage.getItem("dz_owner"));
    document.querySelectorAll(".apps .own").forEach(b => b.hidden = !ok);
  } catch (e) {}
}
showOwn();
document.querySelectorAll(".apps .own").forEach(b => b.addEventListener("click", () => {
  goTab(b.dataset.ctl);
}));

document.getElementById("goPult").addEventListener("click", () => goTab("pult"));
// переход на другую вкладку — всегда явным ?tab=, чтобы не зависеть от прошлого адреса
function goTab(tab) {
  try { localStorage.setItem("dz_tab", tab); } catch (e) {}
  location.replace((tab === "pult" ? "pult.html" : "ctl.html") + "?g=" + encodeURIComponent(GIST) + "&tab=" + tab);
}

async function fetchData() {
  if (!GIST) throw new Error("no gist");
  try {
    const r = await fetch("https://api.github.com/gists/" + GIST, { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const f = (await r.json()).files["data.json"];
    return JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
  } catch (e) {
    const r = await fetch("https://gist.githubusercontent.com/raw/" + GIST + "/data.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
}

(async () => {
  if (tg) { tg.ready(); tg.expand(); }
  try { data = JSON.parse(localStorage.getItem("dz_data") || "null"); } catch (e) {}
  if (data) await render();
  try {
    const fresh = await fetchData();
    showOwn(fresh.owner);
    if (JSON.stringify(fresh) !== JSON.stringify(data)) {
      data = fresh;
      localStorage.setItem("dz_data", JSON.stringify(fresh));
      await render();
    }
  } catch (e) {
    if (!data) document.getElementById("app").innerHTML = '<div class="empty">Не удалось загрузить задания.<br>Проверьте интернет и откройте ещё раз.</div>';
  }
})();
</script>
